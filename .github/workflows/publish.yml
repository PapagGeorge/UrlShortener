name: Publish

# Builds the four images (linux/amd64) and pushes them to GHCR, only after CI passed on a push to main.
# The Linux box pulls them (deploy/update.sh): GitHub never connects to it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Never from a pull request or a fork: only a successful CI run of a push to main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: urlshortener-gateway
            dockerfile: src/Gateway/Dockerfile
            context: .
          - image: urlshortener-write-service
            dockerfile: src/Services/WriteService/Dockerfile
            context: .
          - image: urlshortener-read-service
            dockerfile: src/Services/ReadService/Dockerfile
            context: .
          - image: urlshortener-web
            dockerfile: web/Dockerfile
            context: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute the tags
        id: tags
        run: echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/papaggeorge/${{ matrix.image }}:latest
            ghcr.io/papaggeorge/${{ matrix.image }}:${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/PapagGeorge/UrlShortener
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
