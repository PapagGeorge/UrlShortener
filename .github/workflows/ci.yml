name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # Proves every Dockerfile builds (linux/amd64, same as the published images). Nothing is pushed.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: src/Gateway/Dockerfile
          - name: write-service
            dockerfile: src/Services/WriteService/Dockerfile
          - name: read-service
            dockerfile: src/Services/ReadService/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Brings the whole compose stack up on the runner and runs the end-to-end smoke test through the Gateway
  # (create, redirect, cache, alias, 404, 410). This is the system integration test (SIT) on every PR.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create a throwaway .env (CI only)
        run: |
          {
            echo "POSTGRES_DB=urlshortener"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "WRITE_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "READ_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "OBFUSCATION_KEY=$(openssl rand -base64 32)"
            echo "PUBLIC_BASE_URL=http://localhost:8080"
          } > .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: scripts/smoke.sh

      - name: Show the logs when something failed
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # The prod compose cannot be started here (its images exist only after a merge), so check that it is valid
  # and has not drifted from the dev compose that the smoke test above does run.
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway env files (CI only)
        run: |
          for file in .env deploy/.env; do
            {
              echo "POSTGRES_DB=urlshortener"
              echo "POSTGRES_PASSWORD=ci"
              echo "WRITE_DB_PASSWORD=ci"
              echo "READ_DB_PASSWORD=ci"
              echo "OBFUSCATION_KEY=ci"
              echo "PUBLIC_BASE_URL=http://localhost:8080"
            } > "$file"
          done

      - name: Both compose files are valid
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config --quiet

      - name: No drift between dev and prod compose
        run: scripts/check-compose-drift.sh .env deploy/.env
